# Windows functional verification.
#
# Levanta los fixtures locales (playlist M3U Plus, guia XMLTV y streams de
# prueba), compila la app de Windows y ejecuta el arnes de integracion que corre
# sobre la app real: datos (M3U/EPG/auto-mapper), pantalla de canales,
# reproduccion con media_kit y failover de un Smart Channel.
#
# El informe de la ejecucion y el bundle generado se publican como artefactos.
name: Verify Windows (functional)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Functional harness (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ─── Fixtures locales ───────────────────────────────────────────────
      - name: Install ffmpeg (fixture generation)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          "$machinePath;$userPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate fixtures
        run: python tools/fixtures/generate_fixtures.py

      # ─── Compilacion y arnes ────────────────────────────────────────────
      - name: Build Windows (debug)
        run: flutter build windows --debug

      - name: Prepare debug runtime (CRT junto al .exe)
        shell: bash
        run: bash tools/fixtures/run_windows_debug.sh

      - name: Run functional harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          # El servidor de fixtures se levanta aquí, en el mismo paso que lo usa:
          # un proceso abierto en un paso anterior no llega vivo al arnés.
          $server = Start-Process -FilePath python `
            -ArgumentList "tools/fixtures/fixtures_server.py", "8899" `
            -RedirectStandardOutput fixtures-server.log `
            -RedirectStandardError fixtures-server.err.log `
            -PassThru
          $server.Id | Out-File -FilePath fixtures-server.pid -Encoding ascii
          $ready = $false
          foreach ($attempt in 1..30) {
            try {
              $response = Invoke-WebRequest -Uri http://127.0.0.1:8899/playlist.m3u `
                -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "fixtures listos ($($response.RawContentLength) bytes)"
                $ready = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Write-Error "el servidor de fixtures no respondio en 30 intentos"
            exit 1
          }
          try {
            flutter test integration_test/windows_functional_test.dart -d windows `
              --timeout 300s 2>&1 | Tee-Object -FilePath reports/windows-verification.txt
            $status = $LASTEXITCODE
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
          flutter --version | Out-File -Append reports/windows-verification.txt
          Copy-Item -Force fixtures-server.log reports/ -ErrorAction SilentlyContinue
          exit $status

      - name: Collect built bundle
        if: always()
        shell: pwsh
        run: |
          # Si un paso anterior fallo, `reports/` puede no existir todavia:
          # el arnes lo crea, pero este paso corre incluso cuando no llego.
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          if (Test-Path "build\windows\x64\runner\Debug") {
            Compress-Archive -Path "build\windows\x64\runner\Debug\*" `
              -DestinationPath "reports/clubtivi-windows-debug.zip" -Force
          }

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: reports/
          if-no-files-found: warn

